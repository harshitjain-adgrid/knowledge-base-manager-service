# Product-knowledge retrieval evaluation set.
#
# Targets the real content in content/product-knowledge/ — 28 documents across
# 10 domains. Each query names the document that should answer it. Retrieval
# returns chunks, so a query passes when a chunk from the expected document
# appears in the top k: the assistant only needs the right passage in context,
# not the whole file.
#
# None of these repeats a heading or a "Frequently asked as" line from the
# document it targets. Reusing those would measure string overlap rather than
# retrieval, and every document would pass regardless of how it was written.
#
# tiers:
#   easy      — the subject of the document, asked in the words a merchant uses
#   medium    — asked sideways, or in Hindi/Hinglish
#   confusable— close to a neighbouring document. `not_expect` names the
#               neighbour; retrieving it above the right one fails the case.
#   negative  — nothing in the knowledge base covers it. The right outcome is a
#               low top score, so the assistant says it does not know.

queries:

# ── easy: one per document ──────────────────────────────────────────────
- { q: "why should I put my shop on this platform",            expect: "What LessPay Does for Your Shop",        tier: easy }
- { q: "which jobs can I hand over instead of doing them myself", expect: "What Chotu Can Do for You",           tier: easy }
- { q: "what steps come before I can start taking money",      expect: "Setting Up Your Shop",                   tier: easy }
- { q: "which actions ask me for a secret code",               expect: "Your MPIN and What It Protects",         tier: easy }
- { q: "I moved to a new market and need to correct my address", expect: "Your Shop Name, Category and Address", tier: easy }
- { q: "how do I tell people I do home delivery and have parking", expect: "Service Modes, Keywords and Facilities", tier: easy }
- { q: "how many pictures am I allowed to put up",             expect: "Photos on Your Shop Page",               tier: easy }
- { q: "should I cut my prices or give something extra away",  expect: "Deals and Discounts — the Difference",   tier: easy }
- { q: "I want twenty percent off on bills over five hundred", expect: "Creating a Discount",                    tier: easy }
- { q: "I want to give a free samosa with every tea",          expect: "Creating a Deal",                        tier: easy }
- { q: "can I stop one person from using the same offer ten times", expect: "Who Gets Your Offer, and How Often", tier: easy }
- { q: "can I make something that starts next monday instead of today", expect: "Offer Status and Validity",     tier: easy }
- { q: "I made an offer and nobody can see it",                expect: "Why Your Offer Is Not Showing or Applying", tier: easy }
- { q: "walk me through what happens when someone pays at my counter", expect: "How You Get Paid",               tier: easy }
- { q: "I want to check everything that came in over the last month", expect: "Looking at Your Payment History",  tier: easy }
- { q: "there is money showing in the app but nothing in my account", expect: "When Your Money Reaches Your Bank", tier: easy }
- { q: "what sits behind the code that customers scan",        expect: "Your UPI QR Code",                       tier: easy }
- { q: "I want my takings to go to a different account from now on", expect: "Managing More Than One QR Code",   tier: easy }
- { q: "how do I pay to get in front of more people",          expect: "What Promotions Are",                    tier: easy }
- { q: "what will it cost to reach two thousand people for a week", expect: "What a Promotion Costs",            tier: easy }
- { q: "take me through booking an advertisement step by step", expect: "Running a Promotion Campaign",          tier: easy }
- { q: "what is the balance inside the app actually for",      expect: "Credits and Your Wallet",                tier: easy }
- { q: "is there a deadline on the balance I was given free",  expect: "When Credits Expire",                    tier: easy }
- { q: "what paid plans can I sign up for",                    expect: "Packages and Programs",                  tier: easy }
- { q: "why is there an extra amount on top of the plan price", expect: "What You Pay for a Package",            tier: easy }
- { q: "I told another shopkeeper about this, do I get anything", expect: "Referring Other Shops",               tier: easy }
- { q: "what makes somebody nearby end up walking into my shop", expect: "How Customers Find Your Shop",         tier: easy }
- { q: "what does my page look like from the shopper side",    expect: "What Customers See About Your Shop",     tier: easy }

# ── medium: sideways, or in Hinglish ────────────────────────────────────
- { q: "chotu se kaun kaun se kaam karwa sakte hain",          expect: "What Chotu Can Do for You",              tier: medium }
- { q: "pin kis kis cheez ke liye maangta hai",                expect: "Your MPIN and What It Protects",         tier: medium }
- { q: "dukaan ka pata galat chadh gaya hai theek karna hai",  expect: "Your Shop Name, Category and Address",   tier: medium }
- { q: "menu ki photo kitni lag sakti hai",                    expect: "Photos on Your Shop Page",               tier: medium }
- { q: "deal aur discount mein kya farak hai",                 expect: "Deals and Discounts — the Difference",   tier: medium }
- { q: "ek grahak kitni baar wahi offer utha sakta hai",       expect: "Who Gets Your Offer, and How Often",     tier: medium }
- { q: "aaj ka total kaise nikalein",                          expect: "Looking at Your Payment History",        tier: medium }
- { q: "bank mein transfer kis time hota hai",                 expect: "When Your Money Reaches Your Bank",      tier: medium }
- { q: "purana qr hatana hai naya chalu karna hai",            expect: "Managing More Than One QR Code",         tier: medium }
- { q: "vigyapan ka rate kya lagta hai",                       expect: "What a Promotion Costs",                 tier: medium }
- { q: "wallet mein do alag alag balance kyun dikh rahe hain", expect: "Credits and Your Wallet",                tier: medium }
- { q: "muft mila hua paisa khatam ho jayega kya",             expect: "When Credits Expire",                    tier: medium }
- { q: "jama rakhi hui rakam wapas milti hai kya",             expect: "What You Pay for a Package",             tier: medium }
- { q: "dost ko jodne par kya faayda hai",                     expect: "Referring Other Shops",                  tier: medium }
- { q: "grahak app par meri dukaan tak kaise pahunchega",      expect: "How Customers Find Your Shop",           tier: medium }
- { q: "what do I have to finish before my shop goes live",    expect: "Setting Up Your Shop",                   tier: medium }
- { q: "I sell chaat but people searching for snacks never find me", expect: "Service Modes, Keywords and Facilities", tier: medium }

# ── confusable: the neighbour is named ──────────────────────────────────
- { q: "buy one get one free, how do I set that up",           expect: "Creating a Deal",                        not_expect: "Creating a Discount",              tier: confusable }
- { q: "flat fifty rupees off, how do I set that up",          expect: "Creating a Discount",                    not_expect: "Creating a Deal",                  tier: confusable }
- { q: "I want to pay so more people see the discount I just made", expect: "Running a Promotion Campaign",      not_expect: "Creating a Discount",              tier: confusable }
- { q: "difference between giving money off and paying for reach", expect: "What Promotions Are",                not_expect: "Deals and Discounts — the Difference", tier: confusable }
- { q: "how many different people in total can claim it before it stops", expect: "Who Gets Your Offer, and How Often", not_expect: "Offer Status and Validity",  tier: confusable }
- { q: "it says active but customers tell me it is not there", expect: "Why Your Offer Is Not Showing or Applying", not_expect: "Offer Status and Validity",     tier: confusable }
- { q: "a customer paid me but I cannot find it in the list",  expect: "How You Get Paid",                       not_expect: "When Your Money Reaches Your Bank", tier: confusable }
- { q: "the app says success but the bank has not credited me", expect: "When Your Money Reaches Your Bank",     not_expect: "How You Get Paid",                 tier: confusable }
- { q: "it will not let me remove the code I am using",        expect: "Managing More Than One QR Code",         not_expect: "Your UPI QR Code",                 tier: confusable }
- { q: "does the money I topped up myself ever lapse",         expect: "When Credits Expire",                    not_expect: "Credits and Your Wallet",          tier: confusable }
- { q: "which part of my balance can pay for a whatsapp blast", expect: "Credits and Your Wallet",               not_expect: "When Credits Expire",              tier: confusable }
- { q: "is tax added on top of what I pay to advertise",       expect: "What a Promotion Costs",                 not_expect: "What You Pay for a Package",       tier: confusable }
- { q: "is tax added on top of my subscription fee",           expect: "What You Pay for a Package",             not_expect: "What a Promotion Costs",           tier: confusable }
- { q: "a shopper says the deal did not come off their bill",  expect: "What Customers See About Your Shop",     not_expect: "Creating a Deal",                  tier: confusable }


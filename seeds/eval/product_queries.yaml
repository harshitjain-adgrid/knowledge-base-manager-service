- { q: "how do I add my son as a staff user on my account",    tier: negative }
- { q: "am I eligible for a business loan through this",       tier: negative }
- { q: "how do I export my sales into tally",                  tier: negative }
- { q: "can I ship my products to customers in another state", tier: negative }
- { q: "how do I change the app language to tamil",            tier: negative }
- { q: "can I accept card payments with a swipe machine",      tier: negative }
- { q: "what is the weather going to be tomorrow",             tier: negative }

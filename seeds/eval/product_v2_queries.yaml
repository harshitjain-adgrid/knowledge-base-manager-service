# Product-knowledge v2 retrieval evaluation set.
#
# Targets content/product-knowledge-v2/ — 18 documents written to Document
# Contract v2, loaded into the `product-knowledge-v2` knowledge base.
#
# Built to the rules in docs/KNOWLEDGE_BASE_STRATEGY.md §2.8, which exist
# because they are what makes a number trustworthy:
#
#   - No query copies a heading or a "Frequently asked as" line. That would
#     measure string overlap, not retrieval, and every document would pass
#     however badly it was written.
#   - No utterance was ever added to a document because a query here failed.
#     That calibrates the instrument against itself.
#   - Failing cases stay in the set.
#
# tiers:
#   easy       — the subject of the document, in merchant words
#   medium     — asked sideways; Roman Hinglish and Devanagari, scored together
#                but written separately so a script-specific failure is visible
#   confusable — close to a named near-neighbour. `not_expect` names it, and
#                retrieving the neighbour first fails the case
#   procedural — "step by step", "kaise karu". The failure class that made
#                'offer kaise banau step by step' refuse against v1
#   entity     — a rare literal: UTR, PIN, KYC, STOP. Dense vectors average
#                these away; this tier is what a lexical signal would fix
#   negative   — genuinely uncovered. The right outcome is a low top score

queries:

